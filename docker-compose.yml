services:
  dev:
    build:
      context: .
      target: dev
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    environment:
      - GH_TOKEN
      - GITHUB_TOKEN
      - PROVENANCE_REPO
      - RELEASE_VERSION
    volumes:
      - .:/app
      - ${CARGO_CACHE:-cargo}:/cargo
      - ${TARGET_CACHE:-target}:/cargo-target

  wine:
    build:
      context: .
      target: wine
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - ${TARGET_CACHE:-target}:/cargo-target:ro
      - wineprefix:/wine

volumes:
  cargo:
  target:
  wineprefix:
