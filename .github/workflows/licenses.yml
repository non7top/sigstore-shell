name: licenses

# Fails when a dependency's licence is not one deny.toml allows (the project ships under Apache-2.0).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1

      # cargo-deny only reads the dependency tree, so the runner's stable toolchain is enough and the pinned one is not installed.
      - name: Check the licences
        run: cargo deny check licenses
        env:
          RUSTUP_TOOLCHAIN: stable
