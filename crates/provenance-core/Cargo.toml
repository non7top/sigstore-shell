[package]
name = "provenance-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read, look up and verify the Sigstore provenance of an exe"

[features]
# Exposes the synthetic PE builder used by the unit tests, for smoke tests of other crates.
test-fixtures = []

[dependencies]
async-trait = "0.1"
hex = "0.4"
jiff = "0.2"
pelite = { version = "0.10", default-features = false, features = ["std", "mmap"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"
sha2 = "0.11"
sigstore-verify = { version = "0.14", features = ["tuf"] }
sigstore-rekor = "0.14"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "fixture_exe"
required-features = ["test-fixtures"]
