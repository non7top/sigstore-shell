[package]
name = "sigstore-shell-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Explorer property-sheet extension that shows an exe's Sigstore provenance"

[features]
# Test hook: SIGSTORE_SHELL_DEMO_REPORT=<report.json> shows that report without a lookup. Never enabled in releases.
demo-report = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jiff = "0.2"
provenance-core = { path = "../provenance-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
async-trait = "0.1"

[build-dependencies]
winresource = "0.1"
