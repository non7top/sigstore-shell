[package]
name = "sigstore-shell-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line prototype of the sigstore-shell provenance check"

[dependencies]
clap = { version = "4", features = ["derive"] }
provenance-core = { path = "../provenance-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
winresource = "0.1"
