# cargo-deny: every dependency's licence must be one the project can ship under Apache-2.0.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: only changes to the MPL-licensed files themselves would have to be shared.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
